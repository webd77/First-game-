<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sakura Gaon 3D</title>
<style>
:root{--ink:#1f3a4d;--paper:#fffdf6;--blue:#4aa8f0;--pink:#ff7eb6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#1f3a4d;--paper:#fffdf6}}
:root[data-theme="dark"]{--ink:#1f3a4d;--paper:#fffdf6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:#8fe3d0;font-family:'Comic Sans MS','Segoe Print',system-ui,sans-serif;touch-action:none;user-select:none;color:var(--ink)}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;z-index:0}
#sel,#hud,#side,#help,#say,#act,#js,#jb,#hb,#sit{z-index:10}
#sit{position:fixed;right:18px;bottom:calc(240px + env(safe-area-inset-bottom,0px));display:none;background:var(--blue);color:#fff}
#jb{position:fixed;right:18px;bottom:calc(40px + env(safe-area-inset-bottom,0px));width:86px;height:86px;border-radius:50%;background:var(--blue);color:#fff;font-size:15px;padding:0;display:none;touch-action:none}
#hb{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px));width:48px;height:48px;padding:0;font-size:22px;display:none}
body.hide #js,body.hide #jb,body.hide #sit{display:none!important}
#sel{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:18px 12px calc(18px + env(safe-area-inset-bottom,0px));pointer-events:none;text-align:center}
#sel>*{pointer-events:auto}
h1{margin:0;font-size:clamp(28px,7vw,54px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;letter-spacing:2px;text-shadow:4px 4px 0 var(--ink)}
#nm{font-size:clamp(22px,5vw,34px);font-weight:700;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill}
#bt{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
button{font:inherit;font-weight:700;border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);padding:8px 16px;font-size:17px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
button.on{background:var(--pink);color:#fff}
#go{background:var(--blue);color:#fff;font-size:21px;padding:12px 34px}
#hud{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:5px 12px;font-weight:700;display:none}
#side{position:fixed;right:10px;top:calc(68px + env(safe-area-inset-top,0px));display:none;flex-direction:column;gap:8px}
#side button{width:48px;height:48px;padding:0;font-size:22px}
#help{position:fixed;left:10px;top:calc(56px + env(safe-area-inset-top,0px));font-size:12px;color:#fff;text-shadow:1px 1px 0 var(--ink);display:none}
#say{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(88vw,520px);display:none}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.opts button{font-size:15px;padding:6px 12px;border-radius:10px;text-align:left;box-shadow:0 3px 0 var(--ink)}
body.conv #act,body.conv #sit{display:none!important}
#say .tag{display:inline-block;background:var(--blue);color:#fff;font-weight:700;padding:3px 14px;border:3px solid var(--ink);border-bottom:0;margin-left:10px;letter-spacing:1px}
#say .box{background:var(--paper);border:3px solid var(--ink);padding:14px 18px;font-size:18px;box-shadow:5px 5px 0 #0004}
#act{position:fixed;right:18px;bottom:calc(150px + env(safe-area-inset-bottom,0px));display:none;background:var(--pink);color:#fff}
#js{position:fixed;left:18px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;background:#ffffff66;border:3px solid #fff;display:none;touch-action:none}
#kn{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:var(--pink)}
</style>
</head>
<body>
<div id="sel">
  <h1>🌸 SAKURA GAON 🌸</h1>
  <div><div id="nm"></div><div id="bt"></div><button id="go">Game shuru karo ▶</button></div>
</div>
<div id="hud"></div><div id="help">WASD = chalo · SPACE = jump · F = baitho · E = baat/pyaar</div>
<div id="side"><button id="mu">🎵</button><button id="fit">👕</button><button id="dn">🌙</button><button id="re">🔄</button></div>
<div id="say"></div><button id="act">💬 Baat karo</button><button id="sit">🪑 Baitho (F)</button><button id="jb">⬆<br>JUMP</button><button id="hb">👁</button>
<div id="js"><div id="kn"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),T=THREE;
const rng=(()=>{let s=11;return()=>(s=s*16807%2147483647)/2147483647;})();
const rd=new T.WebGLRenderer({antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio||1,2));document.body.appendChild(rd.domElement);
const sc=new T.Scene(),cam=new T.PerspectiveCamera(80,1,.1,700);
sc.fog=new T.Fog(0x9fe9d6,90,300);
const hemi=new T.HemisphereLight(0xffffff,0x88c9a0,.8);sc.add(hemi);
const sun=new T.DirectionalLight(0xffffff,.8);sun.position.set(30,60,20);sc.add(sun);
const gm=new T.DataTexture(new Uint8Array([110,190,255]),3,1,T.LuminanceFormat);gm.minFilter=gm.magFilter=T.NearestFilter;gm.needsUpdate=true;
const OL=new T.MeshBasicMaterial({color:0x1b2b3a,side:T.BackSide});
const mat=c=>new T.MeshToonMaterial({color:c,gradientMap:gm});
function mk(geo,c,x,y,z,ol){ol=ol===undefined?.12:ol;const m=new T.Mesh(geo,mat(c));m.position.set(x||0,y||0,z||0);
 if(ol){geo.computeBoundingBox();const s=geo.boundingBox.getSize(new T.Vector3());const o=new T.Mesh(geo,OL);o.scale.set(1+ol*2/Math.max(s.x,.4),1+ol*2/Math.max(s.y,.4),1+ol*2/Math.max(s.z,.4));m.add(o);}return m;}
function cvs(w,h,f){const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c;}
// sky
const dotTex=new T.CanvasTexture(cvs(32,32,g=>{g.fillStyle='#fff';g.beginPath();g.arc(16,16,15,0,7);g.fill();}));
const skyTex=new T.CanvasTexture(cvs(1024,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#46c9ad');gr.addColorStop(.6,'#8fe6d0');gr.addColorStop(1,'#d6fff0');g.fillStyle=gr;g.fillRect(0,0,w,h);
 for(let i=0;i<90;i++){const x=rng()*w,y=rng()*h*.7,l=60+rng()*160;g.fillStyle=i%3?'#b4f2de':'#eafff6';g.beginPath();g.ellipse(x,y,l,8+rng()*14,-.15,0,7);g.fill();}}));
const sky=new T.Mesh(new T.SphereGeometry(450,24,16),new T.MeshBasicMaterial({map:skyTex,side:T.BackSide,fog:false}));sc.add(sky);
// ground + roads + river
const gnd=new T.Mesh(new T.PlaneGeometry(900,900),mat(0x82d67c));gnd.rotation.x=-Math.PI/2;sc.add(gnd);
const RZ=-10,WB=145;
function plane(w,d,c,x,y,z,r){const m=new T.Mesh(new T.PlaneGeometry(w,d),new T.MeshBasicMaterial({color:c}));m.rotation.x=-Math.PI/2;m.rotation.z=r||0;m.position.set(x,y,z);sc.add(m);return m;}
plane(2*WB+20,8,0x6f8087,0,.03,30);plane(8,WB,0x6f8087,0,.03,WB/2);plane(8,WB-20,0x6f8087,0,.03,-(WB+20)/2);
for(let i=-14;i<=14;i++){plane(2.5,.3,0xf4f4ea,i*10,.05,30);}
for(let i=0;i<18;i++){const zz=3+i*7.5;if(Math.abs(zz-30)>6)plane(.3,2.5,0xf4f4ea,0,.05,zz);plane(.3,2.5,0xf4f4ea,0,.05,-24-i*7);}
const wTex=new T.CanvasTexture(cvs(256,64,(g,w,h)=>{g.fillStyle='#4fb8f0';g.fillRect(0,0,w,h);g.strokeStyle='#d9f6ff';g.lineWidth=3;for(let i=0;i<6;i++){g.beginPath();const y=8+i*10;g.moveTo(0,y);for(let x=0;x<=w;x+=16)g.lineTo(x,y+(x/16%2?4:-4));g.stroke();}}));
wTex.wrapS=wTex.wrapT=T.RepeatWrapping;wTex.repeat.set(24,1);
const river=new T.Mesh(new T.PlaneGeometry(2*WB+20,14),new T.MeshBasicMaterial({map:wTex}));river.rotation.x=-Math.PI/2;river.position.set(0,.12,RZ);sc.add(river);
for(const s of[-1,1])sc.add(mk(new T.BoxGeometry(2*WB+20,.8,.8),0xc9c4b0,0,.3,RZ+s*7.2,.08));
const deck=mk(new T.BoxGeometry(8.4,.5,20),0xb9824f,0,.45,RZ,.1);sc.add(deck);
for(const s of[-1,1]){sc.add(mk(new T.BoxGeometry(.3,1.1,20),0x8f5f33,s*4,1.2,RZ,.08));}
// colliders
var cars=[],bld=[],treeG=[];
const boxes=[],circ=[];
function blocked(x,z,m){
 if(Math.abs(x)>WB||Math.abs(z)>WB)return true;
 if(!m&&Math.abs(z-RZ)<7.8&&Math.abs(x)>3.3)return true;
 if(m===2&&Math.abs(x)<3.6&&Math.abs(z-RZ)<10.5)return true;
 for(const b of boxes)if(Math.abs(x-b.x)<b.hw&&Math.abs(z-b.z)<b.hd)return true;
 for(const c of circ)if((x-c.x)**2+(z-c.z)**2<c.r*c.r)return true;
 for(const c of cars){if(!c.g.visible)continue;const p=c.g.position,X=c.L.ax=='x';if(Math.abs(x-p.x)<(X?3:1.9)&&Math.abs(z-p.z)<(X?1.9:3))return true;}
 return false;}
// buildings
const pal=[0xf3e8cf,0xe8c8d0,0xc9e6c4,0xd9d9d4,0xf2d6a8,0xbcd8e8],rf=[0x8aa39a,0xb87a6a,0x6f8fa8,0xa8a08a];
const winG=new T.PlaneGeometry(1.1,1.4),winM=new T.MeshBasicMaterial({color:0x2c5560}),placed=[];
const WP=[],WI=[];function addWin(x,y,z,a){const o=WP.length/3,c=Math.cos(a),sn=Math.sin(a);for(const q of[[-.55,-.7],[.55,-.7],[.55,.7],[-.55,.7]])WP.push(x+q[0]*c,y+q[1],z-q[0]*sn);WI.push(o,o+1,o+2,o,o+2,o+3);}
let tries=0;
while(placed.length<60&&tries++<3000){
 const w=9+rng()*9,d=9+rng()*9,h=7+rng()*13,x=(rng()-.5)*280,z=(rng()-.5)*280;
 if(Math.abs(x)<w/2+8||Math.abs(z-30)<d/2+8||Math.abs(z-RZ)<d/2+12||Math.hypot(x,z-22)<22)continue;
 if(placed.some(p=>Math.abs(p.x-x)<(p.w+w)/2+3&&Math.abs(p.z-z)<(p.d+d)/2+3))continue;
 placed.push({x,z,w,d});
 const b=mk(new T.BoxGeometry(w,h,d),pal[Math.floor(rng()*6)],x,h/2,z,.18);sc.add(b);
 sc.add(mk(new T.BoxGeometry(w+.8,.5,d+.8),rf[Math.floor(rng()*4)],x,h+.25,z,.1));
 for(let k=0;k<4;k++){const a=k*Math.PI/2,nx=Math.sin(a),nz=Math.cos(a),dim=k%2?w:d,wide=k%2?d:w;
  const cols=Math.floor(wide/3.2),rows=Math.floor((h-2)/3.4);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(r==0&&k==0&&c==0)continue;const u=(c-(cols-1)/2)*3.2;addWin(x+nx*(dim/2+.04)+nz*u,2.6+r*3.4,z+nz*(dim/2+.04)-nx*u,a);}}
 if(rng()<.5)sc.add(mk(new T.BoxGeometry(w*.55,1.3,.3),[0xffd23f,0x4aa8f0,0xff7eb6][Math.floor(rng()*3)],x,3.2,z+d/2+.3,.08));
 boxes.push({x,z,hw:w/2+1,hd:d/2+1});bld.push({x,z,hw:w/2+.9,hd:d/2+.9,h:h+.6});}
{const wg=new T.BufferGeometry();wg.setAttribute('position',new T.Float32BufferAttribute(WP,3));wg.setIndex(WI);sc.add(new T.Mesh(wg,winM));}
// water tower + poles
const wt=new T.Group();wt.add(mk(new T.CylinderGeometry(4,4,5,16),0x7fc9a8,0,26,0));wt.add(mk(new T.ConeGeometry(4.3,2.5,16),0x5aa88a,0,30.5,0));
for(const[a,b]of[[-2,-2],[2,-2],[-2,2],[2,2]])wt.add(mk(new T.CylinderGeometry(.3,.3,24,6),0x777777,a,12,b,.08));
wt.position.set(-45,0,-60);sc.add(wt);boxes.push({x:-45,z:-60,hw:4,hd:4});
for(let i=-6;i<=6;i++){const px=i*22+11;const p=mk(new T.CylinderGeometry(.22,.28,12,6),0x6b5a4a,px,6,25.5,.06);sc.add(p);sc.add(mk(new T.BoxGeometry(4,.25,.25),0x6b5a4a,px,11,25.5,.04));circ.push({x:px,z:25.5,r:.7});}
// trees
for(let i=0,n=0;n<120&&i<2500;i++){const x=(rng()-.5)*290,z=(rng()-.5)*290;
 if(Math.abs(x)<8||Math.abs(z-30)<7||Math.abs(z-RZ)<10||Math.hypot(x,z-22)<14||blocked(x,z))continue;n++;
 const pk=rng()<.5,s=.8+rng()*.6,g=new T.Group();g.add(mk(new T.CylinderGeometry(.35,.5,3.5,7),0x8a5a3a,0,1.75,0,.08));
 const cc=pk?[0xffb7d2,0xff9cc2]:[0x4fbf6a,0x3aa75a];g.add(mk(new T.IcosahedronGeometry(2.6,1),cc[0],0,5,0,.12));g.add(mk(new T.IcosahedronGeometry(1.8,1),cc[1],1.2,6.6,.6,.1));
 g.position.set(x,0,z);g.scale.setScalar(s);sc.add(g);treeG.push(g);circ.push({x,z,r:1.1*s});}
// ---- extra map details ----
let jumpReq=false;
function camHit(x,y,z){for(const b of bld)if(Math.abs(x-b.x)<b.hw&&Math.abs(z-b.z)<b.hd&&y<b.h)return true;return false;}
function groundH(x,z){return (Math.abs(x)<4.4&&Math.abs(z-RZ)<10.5)?.7:0;}
function blob(r){const m=new T.Mesh(new T.CircleGeometry(r,14),new T.MeshBasicMaterial({color:0,transparent:true,opacity:.22}));m.rotation.x=-Math.PI/2;m.position.y=.07;return m;}
function bx(w,h,d,col,x,y,z){const m=new T.Mesh(new T.BoxGeometry(w,h,d),new T.MeshBasicMaterial({color:col}));m.position.set(x,y,z);return m;}
for(let i=0;i<90;i++){const r=6+rng()*12,p=plane(r,r,[0x74c86f,0x92df83,0x7bd27a][i%3],(rng()-.5)*290,.01+i*.0001,(rng()-.5)*290);p.geometry=new T.CircleGeometry(r/2,16);}
for(let i=0;i<28;i++){const a=i/28*6.283,R=240+rng()*40,h=45+rng()*60;sc.add(mk(new T.ConeGeometry(40+rng()*25,h,7),[0x5dbb9a,0x4aa88a,0x73c9a6][i%3],Math.cos(a)*R,h/2-2,Math.sin(a)*R,.5));}
const clouds=[];for(let i=0;i<14;i++){const g=new T.Group();for(let k=0;k<4;k++){const c=new T.Mesh(new T.IcosahedronGeometry(5+rng()*4,1),new T.MeshBasicMaterial({color:0xffffff,fog:false,transparent:true,opacity:.92}));c.position.set(k*7,rng()*3,rng()*4);g.add(c);}g.position.set((rng()-.5)*400,70+rng()*30,(rng()-.5)*400);sc.add(g);clouds.push(g);}
const wTex2=wTex.clone();wTex2.needsUpdate=true;wTex2.repeat.set(14,1);
{const r2=new T.Mesh(new T.PlaneGeometry(2*WB+20,14),new T.MeshBasicMaterial({map:wTex2,transparent:true,opacity:.35}));r2.rotation.x=-Math.PI/2;r2.position.set(0,.14,RZ);sc.add(r2);}
for(let i=0;i<44;i++){const x=(rng()-.5)*280;if(Math.abs(x)<7)continue;const l=new T.Mesh(new T.CircleGeometry(.8+rng()*.5,10),new T.MeshBasicMaterial({color:0x3fae5a}));l.rotation.x=-Math.PI/2;l.position.set(x,.16,RZ+(rng()-.5)*9);sc.add(l);
 if(i%2){const f=new T.Mesh(new T.CircleGeometry(.25,8),new T.MeshBasicMaterial({color:0xff9cc8}));f.rotation.x=-Math.PI/2;f.position.set(x,.18,l.position.z);sc.add(f);}}
function sw(x,z,w,d){sc.add(mk(new T.BoxGeometry(w,.14,d),0xddd9c8,x,.07,z,0));}
for(const s of[-1,1]){sw(s*75,25,140,2.6);sw(s*75,35,140,2.6);sw(s*5.6,90,2.4,110);sw(s*5.6,12.5,2.4,25);sw(s*5.6,-82.5,2.4,125);}
for(let i=-3;i<=3;i++)plane(.9,3,0xf4f4ea,i*1.15,.06,22);
for(let i=-2;i<=2;i++){plane(3,.9,0xf4f4ea,8.5,.06,30+i*1.4);plane(3,.9,0xf4f4ea,-8.5,.06,30+i*1.4);}

[[-16.5,36.9,-1,0x2fc4a6],[20,36.9,-1,0xe5483a],[-40,23.3,1,0x4aa8f0],[55,23.3,1,0xffb347]].forEach(v=>{sc.add(mk(new T.BoxGeometry(1.6,2.6,1.2),v[3],v[0],1.3,v[1],.06));sc.add(bx(1.1,1.4,.05,0xcff6ff,v[0],1.6,v[1]+v[2]*.63));boxes.push({x:v[0],z:v[1],hw:1.4,hd:1.2});});
[[-30,36.6,-1],[8,36.6,-1],[35,23.6,1],[-66,23.6,1]].forEach(v=>{sc.add(mk(new T.BoxGeometry(2.6,.25,.9),0xb9824f,v[0],.6,v[1],.05));sc.add(mk(new T.BoxGeometry(2.6,.8,.2),0xa87343,v[0],1.05,v[1]-v[2]*.4,.05));boxes.push({x:v[0],z:v[1],hw:1.8,hd:1});});
function torii(z){for(const s of[-1,1]){sc.add(mk(new T.CylinderGeometry(.55,.65,9,10),0xe5483a,s*6.4,4.5,z,.08));circ.push({x:s*6.4,z,r:1});}
 sc.add(mk(new T.BoxGeometry(16,.9,1.1),0xe5483a,0,9.2,z,.08));sc.add(mk(new T.BoxGeometry(14,.55,.7),0xe5483a,0,7.6,z,.06));sc.add(mk(new T.BoxGeometry(17.5,.35,1.4),0x2b2b33,0,9.85,z,.05));}
torii(72);torii(-70);
const glowTex=new T.CanvasTexture(cvs(64,64,(g,w,h)=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,'rgba(255,255,255,.45)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,w,h);}));
const glows=[],bulbM=new T.MeshBasicMaterial({color:0xcfc9a0});
function glowSprite(x,y,z,s,col,k,par){const m=new T.SpriteMaterial({map:glowTex,color:col,transparent:true,blending:T.AdditiveBlending,depthWrite:false,opacity:0,fog:false});const sp=new T.Sprite(m);sp.position.set(x,y,z);sp.scale.set(s,s,1);(par||sc).add(sp);glows.push({m,k});return sp;}
function pool(x,z,r){const m=new T.MeshBasicMaterial({map:glowTex,color:0xffd36a,transparent:true,blending:T.AdditiveBlending,depthWrite:false,opacity:0});const q=new T.Mesh(new T.PlaneGeometry(r*2,r*2),m);q.rotation.x=-Math.PI/2;q.position.set(x,.11,z);sc.add(q);glows.push({m,k:.8});}
function lamp(x,z,dx,dz){sc.add(mk(new T.CylinderGeometry(.14,.18,6,6),0x4a4f57,x,3,z,.05));const ax=x+dx*1.2,az=z+dz*1.2;
 sc.add(bx(Math.abs(dx)*1.3+.15,.15,Math.abs(dz)*1.3+.15,0x4a4f57,x+dx*.6,6,z+dz*.6));
 const bl=new T.Mesh(new T.SphereGeometry(.42,8,6),bulbM);bl.position.set(ax,5.85,az);sc.add(bl);glowSprite(ax,5.85,az,5,0xffe08a,.9);pool(ax,az,6);circ.push({x,z,r:.6});}
// ---- map v3 ----
const benchList=[];let nearB=null;
function addBench(x,z,f){const g=new T.Group();g.add(mk(new T.BoxGeometry(2.6,.25,.9),0xb9824f,0,.6,0,.05));g.add(mk(new T.BoxGeometry(2.6,.8,.2),0xa87343,0,1.05,-.4,.05));

function wander(e,dt,sp){

 const dx=e.tx-e.x,dz=e.tz-e.z,d=Math.hypot(dx,dz);
 if(d<.4){e.wait=1+Math.random()*3;if(e.home){e.tx=e.home.x+(Math.random()-.5)*20;e.tz=e.home.z+(Math.random()-.5)*20;}else{e.tx=e.x+(Math.random()-.5)*20;e.tz=e.z+(Math.random()-.5)*20;}e.mv=false;return;}
 const nx=e.x+dx/d*sp*dt,nz=e.z+dz/d*sp*dt;if(blocked(nx,nz)){e.tx=e.x;e.tz=e.z;return;}
 e.x=nx;e.z=nz;e.mv=true;e.rot=Math.atan2(dx,dz);}

  {const sb=$('sit');if(P.seat){sb.style.display='block';sb.textContent='🧍 Utho (F)';}else if(nearB){sb.style.display='block';sb.textContent='🪑 Baitho (F)';}else sb.style.display='none';}
  hearts.forEach(h=>{h.userData.l-=dt*.6;h.position.y+=dt*2;h.material.opacity=Math.max(h.userData.l,0);if(h.userData.l<=0)sc.remove(h);});hearts=hearts.filter(h=>h.userData.l>0);
  petals.position.set(P.x,0,P.z);
  const d=11,cx=P.x+Math.sin(yaw)*Math.cos(pitch)*d,cy=2.5+Math.sin(pitch)*d,cz=P.z+Math.cos(yaw)*Math.cos(pitch)*d;
  let k=1;for(let i=1;i<=14;i++){const f=i/14;if(camHit(P.x+(cx-P.x)*f,2.4+(cy-2.4)*f,P.z+(cz-P.z)*f)){k=Math.max((i-1)/14,.1);break;}}
  const tv=new T.Vector3(P.x+(cx-P.x)*k,Math.max(.9,2.4+(cy-2.4)*k),P.z+(cz-P.z)*k);
  if(camHit(cam.position.x,cam.position.y,cam.position.z))cam.position.copy(tv);else cam.position.lerp(tv,k<1?.5:.2);
  cam.lookAt(P.x,2.2,P.z);cam.rotateZ(.06);}
 sky.position.copy(cam.position);
 rd.render(sc,cam);requestAnimationFrame(frame);}
frame();
